<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BreezeTTS2</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="top">
        <div>
          <h1>BreezeTTS2</h1>
          <p class="sub">语音回复 · 音色与福利</p>
        </div>
        <div class="balanceChip">
          <span>余额</span>
          <strong id="balance">—</strong>
          <span>积分</span>
        </div>
      </header>

      <section class="row2">
        <div class="card">
          <label class="label" for="apiKey">API Key</label>
          <div class="inputRow">
            <input id="apiKey" class="input" type="password" placeholder="brz_..." autocomplete="off" spellcheck="false" />
            <button id="saveKey" class="btn primary">保存</button>
          </div>
          <div class="keyHintRow">
            <p class="hint" id="keyHint">还没有填写，粘贴 brz_ 开头的密钥</p>
            <button id="getKey" class="linkBtn strong">获取 API Key →</button>
          </div>

          <div class="switchRow">
            <div>
              <div class="switchTitle">全局语音回复</div>
              <div class="hint">所有 AI 回复自动转成语音</div>
            </div>
            <label class="switch">
              <input id="autoVoice" type="checkbox" />
              <i></i>
            </label>
          </div>

          <div class="switchRow">
            <div>
              <div class="switchTitle">智能判断</div>
              <div class="hint">让模型决定文字还是语音，并生成朗读稿</div>
            </div>
            <label class="switch">
              <input id="smartVoice" type="checkbox" />
              <i></i>
            </label>
          </div>

          <div class="field">
            <div class="fieldHead">
              <span class="label">语速</span>
              <span class="hint" id="speedVal">1.00×</span>
            </div>
            <input id="speed" type="range" min="0.5" max="2" step="0.05" />
          </div>
        </div>

        <div class="card promo">
          <span class="tag">🎁 官方福利</span>
          <h2>1000–10000 积分免费送</h2>
          <p>填写 Key 后可领红包积分，口令 BREEZEBLUE</p>
          <div class="row">
            <button id="copyCode" class="btn glass">BREEZEBLUE 复制</button>
            <button id="copyGift" class="btn white">复制领取链接</button>
          </div>
        </div>
      </section>

      <section class="card invite">
        <div class="inviteBody">
          <h2>邀请朋友，双方得积分</h2>
          <p>把 Breeze 语音分享给朋友，好友注册后你也能拿到奖励积分</p>
          <div class="row">
            <button id="copyInvite" class="btn glass">复制邀请文案</button>
            <button id="copyInviteLink" class="btn white">复制邀请链接</button>
          </div>
        </div>
        <div class="inviteArt">💬<span>🎁</span></div>
      </section>

      <section class="card">
        <div class="sectionHead">
          <h2>音色</h2>
          <button id="openDesign" class="btn primary small">设计音色</button>
        </div>
        <div id="currentVoice" class="current"></div>
        <input id="search" class="input" placeholder="搜索音色（名称或描述）" />
        <div id="voiceList" class="list"></div>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modalCard">
        <div class="modalHead">
          <h2>设计音色</h2>
          <button id="closeDesign" class="iconBtn" aria-label="关闭">×</button>
        </div>
        <p class="hint">用一句话描述你想要的音色，Breeze 会生成 3 个候选供你试听</p>
        <label class="label" for="designDesc">音色描述</label>
        <textarea id="designDesc" class="textarea" maxlength="500"></textarea>
        <div class="hint right" id="designCount">0/500</div>
        <label class="label" for="designText">试听台词（可选）</label>
        <input id="designText" class="input" maxlength="500" />
        <div class="row end">
          <button id="generate" class="btn primary">生成 3 个预览</button>
        </div>
        <div id="designResults" class="hidden">
          <div class="label">选择一个音色</div>
          <div id="previewList" class="list"></div>
          <label class="label" for="designName">音色名称</label>
          <input id="designName" class="input" maxlength="80" />
          <div class="row end">
            <button id="saveDesign" class="btn primary">保存并使用</button>
          </div>
        </div>
        <p id="designNote" class="hint"></p>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
